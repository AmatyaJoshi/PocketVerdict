services:
  mysql:
    image: mysql:8.4
    container_name: buyorwait-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: buyorwait
      MYSQL_USER: buyorwait
      MYSQL_PASSWORD: buyorwait
    ports:
      - "3307:3306"
    volumes:
      - buyorwait-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  buyorwait-mysql:
